{% extends "base.html" %}
{% block content %}
<h1>Users</h1>
<p class="muted">Internal NovaDesk users.</p>
<table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr></thead>
    <tbody>
    {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>{{ 'yes' if user.active else 'no' }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
