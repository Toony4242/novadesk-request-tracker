{% extends "base.html" %}
{% block content %}
<section class="card narrow">
    <h1>{{ status_code }} — {{ title }}</h1>
    <p>{{ message }}</p>
    <p class="muted">If this keeps happening, contact IT support.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}">Go back</a>
</section>
{% endblock %}
